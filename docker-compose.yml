version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melody-extraction-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models
      - UPLOAD_FOLDER=/app/temp_audio
    volumes:
      # Mount temp directory for audio files (optional, for persistence)
      - ./temp_audio:/app/temp_audio
      # Mount models directory to cache downloaded models (optional)
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
